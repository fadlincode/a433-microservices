apiVersion: apps/v1
kind: Deployment
metadata:
  name: karsajobs-ui
  labels:
    app: karsajobs-ui
    tier: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: karsajobs-ui
      tier: frontend
  template:
    metadata:
      labels:
        app: karsajobs-ui
        tier: frontend
    spec:
      containers:
      # Ambil dari GCHR yang sudah dibuild pada branch karsajobs
      - name: karsajobs-ui
        image: ghcr.io/fadlincode/karsajobs-ui:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
        # ---------------------------------------------
        # Environtment Value
        # ---------------------------------------------
        # VUE_APP_BACKEND nilai Node IP dan Node Port sesuai device.
        # port 30031 ambil dari nodePort yang di set pada karsajobs-deployment.yml
        env:
        - name: VUE_APP_BACKEND
          value: "http://192.168.49.2:30031"